services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_LOG_LEVEL=${OLLAMA_LOG_LEVEL}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
    networks:
      - open-webui-network

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    dns:
      - 192.168.10.10
      - 8.8.8.8
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - open-webui-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: bachbyte-open-webui:v0.8.7
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
      - jupyter-data:/jupyter-files
    depends_on:
      - postgres
      - ollama
      - docling
      - jupyter
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL-http://ollama:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    dns:
      - 192.168.10.10
      - 8.8.8.8
    command: >
      bash -c "chown -R 0:0 /app/backend/data && \
               groupadd -g 1000 sharedgroup || true && \
               chgrp -R sharedgroup /jupyter-files && \
               chmod -R g+w /jupyter-files && \
               bash /app/backend/start.sh"
    restart: unless-stopped
    networks:
      - open-webui-network

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile-jupyter
    image: custom-jupyter:python-3.11
    container_name: jupyter
    volumes:
      - jupyter-data:/jupyter-files
    ports:
      - 8888:8888
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=${CODE_EXECUTION_JUPYTER_AUTH_TOKEN}
      - NB_UID=1000
      - NB_GID=100
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS=-R
      - CHOWN_EXTRA=/jupyter-files
      - CHOWN_EXTRA_OPTS=-R
      - NB_DIR=/jupyter-files
      - JUPYTER_LOG_LEVEL=DEBUG
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8888/jupyter/api?token=${CODE_EXECUTION_JUPYTER_AUTH_TOKEN} > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - open-webui-network

  tika:
    image: apache/tika:${TIKA_VERSION-3.2.3.0-full}
    container_name: tika
    restart: unless-stopped
    ports:
      - ${TIKA_PORT-9998}:9998
    healthcheck:
      test: ["CMD", "curl", "-f", "${TIKA_SERVER_ENDPOINT}/tika"]
      interval: ${TIKA_HEALTHCHECK_INTERVAL-60s}
      timeout: ${TIKA_HEALTHCHECK_TIMEOUT-10s}
      retries: ${TIKA_HEALTHCHECK_RETRIES-3}
    networks:
      - open-webui-network

  docling:
    build:
      context: .
      dockerfile: Dockerfile-docling
    image: custom-docling:latest
    container_name: docling
    restart: unless-stopped
    ports:
      - ${DOCLING_PORT-5001}:5001
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "${DOCLING_SERVER_ENDPOINT}/health"]
      interval: ${DOCLING_HEALTHCHECK_INTERVAL-60s}
      timeout: ${DOCLING_HEALTHCHECK_TIMEOUT-10s}
      retries: ${DOCLING_HEALTHCHECK_RETRIES-3}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g
    networks:
      - open-webui-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/cloudflared-config.yaml", "run"]
    volumes:
      - ./cloudflared:/etc/cloudflared
    depends_on:
      - open-webui
    networks:
      - open-webui-network

volumes:
  ollama: {}
  open-webui: {}
  jupyter-data: {}
  postgres-data: {}

networks:
  open-webui-network:
    driver: bridge