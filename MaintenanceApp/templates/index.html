<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BachByte Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, #1a202c 0%, #2d3748 100%);
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white">
    <div class="text-center px-4">
        {% if maintenance %}
            <h1 class="text-4xl md:text-6xl font-bold mb-4">BachByte</h1>
            <p class="text-2xl md:text-3xl">is under maintenance</p>
            <p class="text-lg md:text-xl mt-2">Please check back later</p>
            {% else %}
            <h1 class="text-4xl md:text-6xl font-bold mb-4">BachByte's</h1>
            <p class="text-2xl md:text-3xl">maintenance is done</p>
            <p class="text-lg md:text-xl mt-2">If you are still seeing this page, please refresh your browser or Teams application</p>
        {% endif %}
    </div>
</body>
</html>
